body {

canvas {
  position: fixed;

  z-index: -1;
}

.sunset {
  position: fixed;
  inset: 0;
  z-index: -2;
  background:
    radial-gradient(ellipse at 50% 85%,
      rgba(255, 55, 0, .42), transparent 55%),
    radial-gradient(ellipse at 20% 20%,
      rgba(255, 145, 0, .24), transparent 48%),
    linear-gradient(145deg,
      #321018, #a62e08, #ff6500, #7a170d);
  background-size: 200% 200%;
  animation: sunset 14s ease-in-out infinite alternate;
}

@keyframes sunset {
  from { background-position: 0% 0%; }
  to { background-position: 100% 100%; }
}

<body>
  <div class="sunset"></div>
  <canvas id="particles"></canvas>

  <main class="content">
    <div class="badge">✦ Golden hour ✦</div>
    <h1>Orange<br>Sunset</h1>
    <p>Тепло заката. Энергия огня. Твоя атмосфера.</p>
    <button class="button" id="glowButton">
      Почувствовать закат ✨
    </button>
  </main>

  <script>
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let w, h, dpr;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      particles = Array.from(
        { length: Math.min(65, Math.floor(w / 6)) },
        () => createParticle(true)
      );
    }

    function createParticle(randomY = false) {
      return {
        x: Math.random() * w,
        y: randomY ? Math.random() * h : h + 10,
        r: Math.random() * 2 + .5,
        speed: Math.random() * .45 + .15,
        drift: (Math.random() - .5) * .35,
        alpha: Math.random() * .55 + .2,
        phase: Math.random() * Math.PI * 2
      };
    }

    function animate(time) {
      ctx.clearRect(0, 0, w, h);

      for (const p of particles) {
        p.y -= p.speed;
        p.x += p.drift + Math.sin(time * .0007 + p.phase) * .15;

        if (p.y < -10) Object.assign(p, createParticle());

        const flicker = .7 + Math.sin(
          time * .002 + p.phase
        ) * .3;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, ${120 + Math.floor(
          flicker * 100
        )}, 35, ${p.alpha * flicker})`;
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#ff8c20';
        ctx.fill();
      }

      ctx.shadowBlur = 0;
      requestAnimationFrame(animate);
    }

    document.getElementById('glowButton').addEventListener(
      'click', () => {
        document.body.animate([
          { filter: 'brightness(1)' },
          { filter: 'brightness(1.35)' },
          { filter: 'brightness(1)' }
        ], { duration: 900 });
      }
    );

    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(animate);
  </script>

</body>
